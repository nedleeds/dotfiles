# =========================================================
# tmux config
# ~/.config/tmux/tmux.conf
# symlink: ~/.tmux.conf -> ~/.config/tmux/tmux.conf
# =========================================================

# ---------------------------------------------------------
# Reload config
# ---------------------------------------------------------
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded."


# ---------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------
set -g  @plugin 'tmux-plugins/tpm'
set -ag @plugin 'christoomey/vim-tmux-navigator'
set -ag @plugin 'tmux-plugins/tmux-battery'
set -ag @plugin 'tmux-plugins/tmux-cpu'

# ---------------------------------------------------------
# Core options
# ---------------------------------------------------------
set -g prefix C-a
unbind C-b
set -g mouse on
set -g focus-events on

# pane navigation (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# split panes
unbind '"'
unbind %
bind \\ split-window -h
bind -  split-window -v

# ---------------------------------------------------------
# Terminal / Color
# ---------------------------------------------------------
# 24-bit color
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',tmux-256color:RGB'
set-option -sa terminal-overrides ',tmux-256color:Tc'

# LazyVim ESC responsiveness
set -sg escape-time 0
set -g status-interval 1

# ---------------------------------------------------------
# Clipboard (macOS)
# ---------------------------------------------------------
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------
# Status bar position
# ---------------------------------------------------------
set -g status-position top

# =========================================================
# Theme colors (from lua-line.lua)
# =========================================================
# blue   #80a0ff
# blue2  #3fa3ff
# cyan   #79dac8
# green  #07ba5a
# black  #080808
# yellow #f3CC33
# white  #f6f6f6
# red    #ff5189
# orange #ff9e64
# violet #6f71ff
# grey   #303030

# ---------------------------------------------------------
# Global style reset (IMPORTANT)
# ---------------------------------------------------------
set -g status-style "fg=#f6f6f6,bg=default"
set -g window-status-style "fg=#f6f6f6,bg=default"
set -g window-status-current-style "fg=#07ba5a,bg=default"

# message / command line
set -g message-style "fg=#f3CC33,bg=default"

# ---------------------------------------------------------
# Pane borders
# ---------------------------------------------------------
set -g pane-border-status off
set -g pane-border-format ""
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#07ba5a"

# ---------------------------------------------------------
# Window list (tabs)
# ---------------------------------------------------------
set -g window-status-separator ""

# active window
set -g window-status-current-format \
"#[fg=#07ba5a,bg=default,bold]#[fg=#f6f6f6,bg=default,bold]#I:#W #[fg=default,bg=default]"

# inactive window
set -g window-status-format \
"#[fg=#f6f6f6,bg=default]#[fg=#5f5f5f,bg=default, bold]#I:#W #[fg=#6f71ff,bg=default]"

# activity / bell
set -g window-status-activity-style "fg=#ff9e64,bg=default"
set -g window-status-bell-style     "fg=#ff5189,bg=default"

# ---------------------------------------------------------
# Status left / right
# ---------------------------------------------------------
set -g status-left-length 64
set -g status-right-length 128

# left: session name
set -g status-left \
"#[fg=#2ecc71,bold] #S #[fg=#303030]│"

# right: CPU | BAT | date | time (TPM plugins, script 호출 방식)
set -g status-right \
"#[fg=#ff9e64, bold]CPU #(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)% \
#[fg=#303030]│ \
#[fg=#80a0ff, bold]#(~/.config/tmux/scripts/battery_icon.sh) \
#[fg=#303030]│ \
#[fg=#f3CC33, bold]%y.%m.%d \
#[fg=#303030]│ \
#[fg=#f6f6f6, bold]%H:%M "

# ---------------------------------------------------------
# TPM (must be the very last line)
# ---------------------------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'
