# =========================================================
# tmux config
# ~/.config/tmux/tmux.conf
# symlink: ~/.tmux.conf -> ~/.config/tmux/tmux.conf
# =========================================================

# ---------------------------------------------------------
# Reload config
# ---------------------------------------------------------
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded."


# ---------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------
set -g  @plugin 'tmux-plugins/tpm'
set -ag @plugin 'christoomey/vim-tmux-navigator'
# (REMOVED) tmux-plugins/tmux-battery
# (REMOVED) tmux-plugins/tmux-cpu


# ---------------------------------------------------------
# Core options
# ---------------------------------------------------------
set -g prefix C-a
unbind C-b

set -g mouse on
set -g focus-events on
set -sg escape-time 0

# pane navigation (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# split panes
unbind '"'
unbind %
bind \\ split-window -h
bind -  split-window -v


# ---------------------------------------------------------
# Prefix indicator (show PREFIX briefly)
# ---------------------------------------------------------
set -g @prefix_active 0

# Capture raw C-a and hold PREFIX for a short time
bind-key -n C-a \
  set -g @prefix_active 1 \;\
  refresh-client -S \;\
  switch-client -T prefix \;\
  run-shell -b "sleep 0.4; tmux set -g @prefix_active 0; tmux refresh-client -S"


# ---------------------------------------------------------
# Terminal / Color
# ---------------------------------------------------------
set -g default-terminal "screen-256color"
set -as terminal-features ",screen-256color:RGB"
set -as terminal-overrides ",screen-256color:Tc"

set -g status-interval 1


# ---------------------------------------------------------
# Clipboard (macOS)
# ---------------------------------------------------------
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"


# ---------------------------------------------------------
# Status bar position
# ---------------------------------------------------------
set -g status-position top


# =========================================================
# Theme colors
# =========================================================
# GitHub Dark friendly palette
# text      #c9d1d9
# muted     #8b949e
# divider   #30363d
# blue      #58a6ff
# green     #3fb950
# yellow    #d29922
# purple    #a371f7
# pink      #ff7b72


# ---------------------------------------------------------
# Global style reset
# ---------------------------------------------------------
set -g status-style "fg=#c9d1d9,bg=default"
set -g window-status-style "fg=#c9d1d9,bg=default"
set -g window-status-current-style "fg=#3fb950,bg=default,bold"

# message / command line
set -g message-style "fg=#d29922,bg=default"


# ---------------------------------------------------------
# Pane borders
# ---------------------------------------------------------
set -g pane-border-status off
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#3fb950"


# ---------------------------------------------------------
# Window list (tabs)
# ---------------------------------------------------------
set -g window-status-separator ""

# active window
set -g window-status-current-format \
"#[fg=#c9d1d9,bold]#I:#W "

# inactive window
set -g window-status-format \
"#[fg=#8b949e]#I:#W "


# ---------------------------------------------------------
# Status left / right
# ---------------------------------------------------------
set -g status-left-length 64
set -g status-right-length 160

# left: session name
set -g status-left \
"#[fg=#3fb950,bold] #S \
#[fg=#30363d]│ \
#[fg=#a371f7,bold]#{pane_current_path} \
#[fg=#30363d]│ \
"

# right: SESSION - WINDOW - PWD | CONTEXT | date | time
set -g status-right \
"#[bold]#(~/.config/tmux/scripts/container_name.sh)#[nobold,fg=default] \
#[fg=#30363d]│ \
#[fg=#8b949e,bold]%y.%m.%d \
#[fg=#30363d]│ \
#[fg=#c9d1d9,bold]%H:%M "


# ---------------------------------------------------------
# TPM (must be the very last line)
# ---------------------------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'
